# [KKR-RIA] Scheduled pipeline refresh — production roadmap step 4.
# Monthly (or on-demand) run: ingest → score → enrich → briefs → validate
# → prepare a publication artifact. Secrets come from Doppler via a read-only service token; the
# grounding gate is the hard gate — a red run fails the workflow.

name: RIA Radar pipeline

on:
  schedule:
    # Monthly on day 7; source discovery uses the latest files actually published.
    - cron: '0 6 7 * *'
  workflow_dispatch:
    inputs:
      top:
        description: 'Top-N for enrich + briefs'
        required: false
        default: '75'
      with_bulk:
        description: 'Include SEC structured bulk (slow, ~1.4GB)'
        type: boolean
        required: false
        default: false

concurrency:
  group: ria-radar-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Verify refresh credentials are configured
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: test -n "$DOPPLER_TOKEN" || { echo "Set a RIA-scoped Doppler service token before refreshing"; exit 1; }

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Run pipeline (ingest → score → enrich → briefs)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          TOP: ${{ github.event.inputs.top || '75' }}
        run: |
          [[ "$TOP" =~ ^[0-9]+$ ]] && (( TOP >= 1 && TOP <= 150 )) || { echo "top must be 1..150"; exit 1; }
          BULK=""
          if [ "${{ github.event.inputs.with_bulk }}" = "true" ]; then BULK="--with-bulk"; fi
          doppler run -- npx tsx scripts/run.ts $BULK --stage ingest,score
          doppler run -- npx tsx scripts/run.ts --stage enrich --top "$TOP" --refresh
          doppler run -- npx tsx scripts/run.ts --stage briefs --top "$TOP"

      - name: Validation gate (hard fail on red)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- npx tsx scripts/validate.ts

      - name: Prepare validated publication artifact (no database writes)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- npx tsx scripts/publish.ts

      # Publication remains manual until migration 0006 and release are reviewed.
      - name: Watchlist — diff filings, raise ADV-change alerts, push to Slack
        if: false # enable only with reviewed publication/cutover
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- npx tsx scripts/watch.ts

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ria-radar-output
          path: |
            output/ranked-rias.csv
            output/ranked-rias.html
            output/briefs/
            data/refresh-artifact.json
            data/source-manifest.json
          retention-days: 30
